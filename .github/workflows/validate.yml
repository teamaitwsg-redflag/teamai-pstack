name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    # macOS 的 /bin/bash 是 3.2，程序工具是 BSD 版；審核團腳本兩邊都要能跑
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 結構檢查
        run: python scripts/validate.py
      - name: hook 測試
        run: bash scripts/test_hook.sh
      - name: 審核團腳本測試
        run: /bin/bash scripts/test_review_panel.sh
