name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
# 分支上有新的推送時，取消同一分支還在排隊或執行的舊一輪：連續推送時不讓過時的工作佔著佇列。
# main 不取消，每個進 main 的 commit 都要留下完整的結果。
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    # macOS 的 /bin/bash 是 3.2，程序工具是 BSD 版；審核團腳本兩邊都要能跑
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 整套檢查不到一分鐘；卡住時十分鐘就停，不要佔著機器
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 結構檢查
        run: python scripts/validate.py
      - name: hook 測試
        run: bash scripts/test_hook.sh
      - name: 審核團腳本測試
        run: /bin/bash scripts/test_review_panel.sh
      - name: 規則同步腳本測試
        run: /bin/bash scripts/test_sync_rules.sh
      - name: 安裝與更新腳本測試
        run: /bin/bash scripts/test_install_scripts.sh

  windows:
    # install.ps1 與 update.ps1 只能在 Windows 驗：用假的 claude，在 Windows PowerShell 5.1 與 PowerShell 7 各跑一次
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 與 update.ps1 測試
        shell: powershell
        run: .\scripts\test_install_scripts.ps1
